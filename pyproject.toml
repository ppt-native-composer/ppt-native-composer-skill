[project]
name = "ppt-native-composer"
version = "0.4.0"
description = "Editable native PowerPoint composition runtime"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
  "python-pptx>=1.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "coverage>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["scripts"]
omit = [
  "scripts/create_fixture_blueprints.py",
  "scripts/batch_render_variants.py",
]
